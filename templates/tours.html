{% extends 'base.html' %}

{% block content %}

<h1 class="text-3xl font-bold mb-8">সকল ট্যুর</h1>

<div class="grid grid-cols-1 md:grid-cols-2 gap-6">

{% for tour in tours %}
<div class="bg-white p-6 rounded shadow">

    <h2 class="text-2xl font-bold">{{ tour[1] }}</h2>

    <p>📍 {{ tour[2] }}</p>
    <p>💰 {{ tour[3] }} টাকা</p>
    <p>📅 {{ tour[4] }}</p>

    <a href="/details/{{ tour[0] }}" class="text-blue-600 font-bold mt-4 inline-block">
        বিস্তারিত
    </a>

</div>
{% endfor %}

</div>

{% endblock %}
